<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenTermo</title>
    <style>
      /* Kill the white flash: an opaque base before CSS loads. html carries
         it (the window is non-transparent now); body / #root stay transparent
         so the wallpaper still shows. */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        color: #e4e4e4;
      }
      html { background: #131313; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
